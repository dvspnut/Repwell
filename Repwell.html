<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#EEF1F6; --ink:#0E1218; --muted:#626D7C; --line:#E3E7EE;
  --accent:#0E1218; --on-accent:#FFFFFF;
  --good:#117A4A; --good-bg:#DDF2E7; --warn:#8F5F0A; --warn-bg:#FBEBCB;
  --d1:#D8372F; --d2:#1F5FBF; --d3:#E8B71A; --d4:#3A9A3F;
  --display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --b1:#E8470F; --b2:#C72A5E; --brand:#E8470F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E13; --surface:#151A21; --surface2:#1C222B; --ink:#EEF1F5; --muted:#94A0AF; --line:#262E39;
    --accent:#EEF1F5; --on-accent:#0B0E13;
    --good:#5FD39B; --good-bg:#12372A; --warn:#F0C26A; --warn-bg:#3A2D10;
    --d1:#F0584F; --d2:#4C8DF0; --d3:#F2C93A; --d4:#5DBB61;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151A21; --surface2:#1C222B; --ink:#EEF1F5; --muted:#94A0AF; --line:#262E39;
  --accent:#EEF1F5; --on-accent:#0B0E13;
  --good:#5FD39B; --good-bg:#12372A; --warn:#F0C26A; --warn-bg:#3A2D10;
  --d1:#F0584F; --d2:#4C8DF0; --d3:#F2C93A; --d4:#5DBB61;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;background-color:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,h4,p{margin:0}
#app{max-width:480px;margin:0 auto;padding:18px 16px calc(96px + 8px)}
body.in-session #app{padding-bottom:140px}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.005em}
.sub{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.stack>*+*{margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 24px -16px rgba(20,30,40,.3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.4}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:40px}
:focus-visible{outline:3px solid var(--d2);outline-offset:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.toggle{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;min-height:40px}
.toggle.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.field{width:100%;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
textarea.field{padding:10px 12px;min-height:84px;resize:vertical}
label.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;min-height:56px;color:var(--muted);font-size:12px;font-weight:600}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs button[aria-current="page"] svg{stroke-width:2.4}

/* day cards */
.day{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:12px 14px;position:relative}
.day.sel{border-color:var(--ink);border-left-color:var(--c);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dnm{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;display:block}
.day .df{display:block;color:var(--muted);font-size:14px}
.day .dl{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.day .nx{position:absolute;right:12px;top:12px}
.dayc{--c:var(--d1)}

/* session */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:-18px -16px 12px;padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);border-top:6px solid var(--c)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
.ex h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.ex .meta{color:var(--muted);font-size:13px;margin-top:2px}
.exa{display:flex;gap:8px;margin:10px 0 6px}
.exa .btn{flex:1}
.setshead,.set{display:grid;grid-template-columns:22px 1fr 76px 60px 44px;gap:8px;align-items:center}
.setshead{font-size:12px;color:var(--muted);padding:4px 0}
.setshead span:nth-child(3),.setshead span:nth-child(4){text-align:center}
.set{padding:4px 0}
.sn{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.last{line-height:1.15;min-width:0}
.last b{font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.last small{display:block;font-size:12px;font-weight:600;min-height:14px}
.last small.up{color:var(--good)} .last small.dn{color:var(--warn)}
.in{width:100%;height:46px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-family:var(--display);font-weight:800;font-size:24px;padding:0 4px;-moz-appearance:textfield}
.in::-webkit-outer-spin-button,.in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set.done .in{background:var(--good-bg);border-color:transparent;color:var(--good)}
.tick{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.tick svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.done .tick{background:var(--good);border-color:var(--good)}
.set.done .tick svg{stroke:#fff}
.exf{display:flex;flex-wrap:wrap;gap:0 12px;padding:4px 0 2px}
.exf button{color:var(--muted);font-size:13px;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.reorder .ex{display:flex;align-items:center;gap:10px;padding:10px 12px}
.reorder .ex h3{font-size:20px}
.mv{display:flex;flex-direction:column;gap:6px}
.mv button{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.mv svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* rest timer */
#rest{position:fixed;left:0;right:0;z-index:30;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
body.has-tabs #rest{bottom:calc(57px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
#rest .box{max-width:456px;margin:0 auto;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:10px 12px 12px;box-shadow:0 10px 30px -8px rgba(0,0,0,.45)}
#rest .track{height:4px;border-radius:4px;background:rgba(127,127,127,.35);overflow:hidden;margin-bottom:8px}
#rest .fill{height:100%;width:0;background:var(--on-accent);opacity:.9}
#rest .rr{display:flex;align-items:center;gap:10px}
#rest .t{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
#rest .l{font-size:13px;opacity:.8;display:block}
#rest .bt{display:flex;gap:6px;margin-left:auto}
#rest .bt button{min-width:48px;height:44px;border-radius:10px;border:1px solid rgba(127,127,127,.5);font-weight:700;font-size:14px;color:var(--on-accent);padding:0 10px}
#rest.over .box{background:var(--good);color:#fff}
#rest.over .bt button{color:#fff}
#rest.over .fill{background:#fff}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
#sheet .backdrop{position:absolute;inset:0;background:rgba(10,14,18,.5)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:88%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
#sheet h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin-bottom:10px}
.pk-group h4{font-size:14px;color:var(--muted);font-weight:600;margin:14px 0 4px}
.pk-item{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;text-align:left;min-height:46px;padding:6px 2px;border-bottom:1px solid var(--line)}
.pk-item small{color:var(--muted)}
.hrow3{display:grid;grid-template-columns:76px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}

/* lists / history */
.hrow{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:11px 14px}
.hrow b{font-family:var(--display);font-weight:800;font-size:22px;margin-right:6px}
.note-q{margin-top:6px;font-size:14px;color:var(--muted);font-style:italic}
.month{font-family:var(--display);font-weight:800;font-size:22px;margin:18px 0 8px}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:linear-gradient(180deg,var(--surface),var(--surface2));border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 24px -16px rgba(20,30,40,.3)}
.tile .num{font-size:34px;line-height:1;display:block}
.tile span.s{color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log td,table.log th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
table.log th{color:var(--muted);font-size:12px;font-weight:600}
td.r,th.r{text-align:right !important}
.up{color:var(--good);font-weight:700} .dn{color:var(--warn);font-weight:700}
.bar{display:grid;grid-template-columns:86px 1fr 62px;gap:8px;align-items:center;padding:6px 0;font-size:14px}
.bar .tr{height:14px;background:var(--surface2);border-radius:7px;overflow:hidden}
.bar .fl{height:100%;border-radius:7px;background:var(--good)}
.bar .fl.neg{background:var(--warn)}
.meter{height:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* report */
.rc{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--line);border-radius:14px;padding:14px}
.rc.up{border-left-color:var(--good)} .rc.reps{border-left-color:var(--good)} .rc.down{border-left-color:var(--warn)} .rc.first{border-left-color:var(--d2)}
.rc h3{font-family:var(--display);font-weight:800;font-size:25px;line-height:1.1}
.rc .big{margin:8px 0 6px;font-size:16px}
.rc .big .num{font-size:34px;vertical-align:-3px}
.rc .proj{margin-top:8px;padding:9px 11px;background:var(--surface2);border-radius:10px;font-size:14px}
.rc p{font-size:15px}
.reveal .rc,.reveal .tiles,.reveal .banner{animation:rv .45s ease-out both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.banner{background:var(--good-bg);color:var(--good);border-radius:14px;padding:12px 14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90%}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:18px 0}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:42px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tile .d{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:500}
.tile .d.up{color:var(--good)} .tile .d.dn{color:var(--warn)}
.tile.wide{grid-column:1 / -1}
.mu{stroke:rgba(0,0,0,.28);stroke-width:.8}
.mu.fat{fill:var(--d1)} .mu.rec{fill:var(--d3)} .mu.near{fill:var(--good);fill-opacity:.5} .mu.ready{fill:var(--good)} .mu.none{fill:var(--line)}
.mu.hl{stroke:var(--ink);stroke-width:3}
.nb{fill:url(#skin);stroke:var(--line);stroke-width:1.2}
.body{width:100%;max-width:340px;display:block;margin:0 auto}
.body text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:4px}
.sw-fat{background:var(--d1)} .sw-rec{background:var(--d3)} .sw-near{background:var(--good);opacity:.5} .sw-ready{background:var(--good)} .sw-none{background:var(--line)}
.mrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.rbar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:6px}
.rbar i{display:block;height:100%;background:var(--good)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:18px}
.ex,.rc,.hrow,.day{box-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 24px -18px rgba(20,30,40,.3)}
.btn:not(.ghost){box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.card .link{margin-top:4px}

/* ===== modern theme ===== */
body{letter-spacing:-.005em}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:380px;background:radial-gradient(620px 280px at 88% -50px,rgba(232,71,15,.16),transparent 70%),radial-gradient(520px 240px at -10% 0,rgba(199,42,94,.08),transparent 70%);pointer-events:none;z-index:-1}
#app{padding-bottom:128px}
body.in-session #app{padding-bottom:150px}
.h1{font-weight:800;font-size:34px;letter-spacing:-.035em;line-height:1.05}
.num{font-weight:800;letter-spacing:-.03em}
.card,.tile,.ex,.rc,.hrow,.day{border-radius:22px;box-shadow:0 1px 2px rgba(16,24,40,.05),0 18px 34px -22px rgba(16,24,40,.34)}
.card[style*="border-left"]{border-left-width:6px !important}
.tile{border-radius:20px}
.tile .num{font-size:28px}
.btn{border-radius:16px;min-height:52px;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;font-weight:700;box-shadow:0 12px 24px -12px rgba(232,71,15,.7)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.small{min-height:40px;border-radius:12px}
.toggle{background:var(--surface)}
.field{border-radius:14px;border:1px solid transparent;background:var(--surface2)}
.field:focus,.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,71,15,.2)}
.seg{grid-template-columns:repeat(5,1fr);border-radius:16px;border:0;background:var(--surface2);gap:2px;padding:3px}
.seg button{border-radius:12px;font-size:12px;padding:0 2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 10px -2px rgba(16,24,40,.28)}
/* floating tab bar */
#tabs{left:50%;right:auto;width:calc(100% - 24px);max-width:456px;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-radius:28px;background:color-mix(in srgb,var(--surface) 93%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 18px 36px -14px rgba(16,24,40,.45);padding-bottom:0}
#tabs .in{padding:4px}
#tabs button{min-height:54px;border-radius:22px;font-size:11px;font-weight:700;padding:7px 0}
#tabs button[aria-current="page"]{background:var(--surface2);color:var(--ink)}
#tabs button[aria-current="page"] svg{stroke:var(--brand);stroke-width:2.2}
body.has-tabs #rest{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
/* cards with colour rails */
.day,.hrow{border-left:1px solid var(--line);position:relative;padding-left:30px;overflow:hidden}
.day::before,.hrow::before{content:'';position:absolute;left:12px;top:14px;bottom:14px;width:6px;border-radius:6px;background:var(--c)}
.day.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 18px 34px -22px rgba(16,24,40,.34)}
.day .dnm{font-size:21px;letter-spacing:-.02em}
.hrow b{font-size:18px;letter-spacing:-.02em}
.rc{border-left:1px solid var(--line);position:relative;padding-left:26px;overflow:hidden}
.rc.up,.rc.reps,.rc.down,.rc.first{border-left-color:var(--line)}
.rc::before{content:'';position:absolute;left:10px;top:14px;bottom:14px;width:6px;border-radius:6px;background:var(--line)}
.rc.up::before,.rc.reps::before{background:var(--good)} .rc.down::before{background:var(--warn)} .rc.first::before{background:var(--d2)}
.rc h3{font-size:19px;letter-spacing:-.02em}
.rc .big .num{font-size:26px;vertical-align:-2px}
.ex h3{font-size:19px;letter-spacing:-.02em}
.reorder .ex h3{font-size:17px}
.month{font-size:18px}
#sheet h2{font-size:24px;letter-spacing:-.03em}
#sheet .panel{border-radius:28px 28px 0 0}
#sheet .backdrop{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sbar{border-top:4px solid var(--c);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
/* sets */
.in{border-radius:14px;font-size:20px;font-weight:800;border:1px solid transparent}
.last b{font-size:15px}
.sn{font-size:15px}
.tick{border-radius:50%;width:44px;height:44px}
.set.done .tick{box-shadow:0 8px 16px -8px var(--good)}
/* rest timer */

  c.fillStyle=dark?'#101520':'#C3CBD8'; c.fillRect(-40,floor-62,W+80,3);
  const f=c.createLinearGradient(0,floor,0,floor+40); f.addColorStop(0,dark?'#2A323F':'#8E98A8'); f.addColorStop(1,dark?'#1B212B':'#6E7888'); c.fillStyle=f; c.fillRect(-40,floor,W+80,60);

}
function eff(ph){ return Math.sin(Math.PI*ph); }

  const cam=T.cam||{s:1,x:0,y:0}, floor=T.floor||FLOOR; c.scale(W/320,W/320); c.translate(cam.x||0,cam.y||0); c.scale(cam.s,cam.s);

  if(T.back) T.back(c,J,s);

  drawLeg(c,J.hip,J.knee2,J.ank2,J.toe2,true);

}

/* ---------- audio / timer ---------- */
let AC=null;
function beep(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); [0,.26].forEach(t=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=880; g.gain.value=.18; o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.16); }); }catch(e){} try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){} }
const R={active:false,end:0,total:0,beeped:false,hideAt:0};
let COMPN_C=null;
function compNames(){ if(!COMPN_C){ COMPN_C=new Set(); COMP.forEach(k=>SLOT[k].forEach(n=>COMPN_C.add(n))); } return COMPN_C; }
function restForEx(e){ const c=ST.config; if(c.restAuto===false) return c.restSec||90; const comp=compNames().has(e.name); if(comp&&prof().goal==='strength') return 240; return comp?150:90; }
function startRest(sec){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  R.total=sec; R.end=Date.now()+sec*1000; R.active=true; R.beeped=false;
  const r=$('#rest'); r.hidden=false; r.classList.remove('over'); $('#restLbl').textContent='Rest'; tickAll();
}
function stopRest(){ R.active=false; $('#rest').hidden=true; }
function tickAll(){
  const now=Date.now();
  if(R.active){
    const left=Math.max(0,Math.ceil((R.end-now)/1000)); $('#restT').textContent=fmtT(left);
    $('#restFill').style.width=Math.min(100,Math.max(0,(1-(R.end-now)/(R.total*1000))*100))+'%';
    if(now>=R.end && !R.beeped){ R.beeped=true; beep(); $('#rest').classList.add('over'); $('#restLbl').textContent='Go – next set'; R.hideAt=now+6000; }
    if(R.beeped && now>R.hideAt) stopRest();
  }
  const el=$('#elapsed'); if(el&&ST.draft) el.textContent=fmtT(Math.floor((now-ST.draft.startedAt)/1000));
}
setInterval(tickAll,250);
let WL=null;
function wake(){ try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(l=>{WL=l;}).catch(()=>{}); }catch(e){} }
function unwake(){ try{ if(WL){ WL.release(); WL=null; } }catch(e){} }

/* ---------- charts ---------- */
let CH=0;
function lineChart(pts,o){
  o=o||{}; if(!pts.length) return '';
  const W=340,H=o.h||180,L=38,Rr=12,T=12,B=26;
  let ys=pts.map(p=>p.y); if(o.ref!=null) ys.push(o.ref);
  let lo=o.min!=null?o.min:Math.min.apply(null,ys), hi=o.max!=null?o.max:Math.max.apply(null,ys);
  if(lo===hi){lo-=1;hi+=1;}
  const pd=(hi-lo)*.12; if(o.min==null) lo-=pd; if(o.max==null) hi+=pd;
  const xs=pts.map(p=>p.x); let x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs); if(x0===x1){x0-=864e5;x1+=864e5;}
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-Rr), Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">';
  [lo,(lo+hi)/2,hi].forEach(v=>{ s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+3).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>'; });
  if(o.ref!=null){ s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(o.ref).toFixed(1)+'" y2="'+Y(o.ref).toFixed(1)+'" stroke="var(--d3)" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(W-Rr)+'" y="'+(Y(o.ref)-4).toFixed(1)+'" text-anchor="end" style="fill:var(--ink);font-weight:700">'+esc(o.refLabel||'')+'</text>'; }
  if(pts.length>1){
    const P=pts.slice().sort((a,b)=>a.x-b.x).map(p=>[X(p.x),Y(p.y)]); const gid='ag'+(++CH);
    let d='M'+P[0][0].toFixed(1)+' '+P[0][1].toFixed(1);
    for(let i=0;i<P.length-1;i++){
      const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||P[i+1], t=.18, lo2=Math.min(p1[1],p2[1]), hi2=Math.max(p1[1],p2[1]);
      const c1y=Math.min(hi2,Math.max(lo2,p1[1]+(p2[1]-p0[1])*t)), c2y=Math.min(hi2,Math.max(lo2,p2[1]-(p3[1]-p1[1])*t));
      d+=' C'+(p1[0]+(p2[0]-p0[0])*t).toFixed(1)+' '+c1y.toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])*t).toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
    }
    const bot=(H-B).toFixed(1);
    s+='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand)" stop-opacity=".30"/><stop offset="1" style="stop-color:var(--brand)" stop-opacity="0"/></linearGradient></defs>';
    s+='<path d="'+d+' L'+P[P.length-1][0].toFixed(1)+' '+bot+' L'+P[0][0].toFixed(1)+' '+bot+' Z" fill="url(#'+gid+')"/>';
    s+='<path d="'+d+'" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach(p=>{ s+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4" fill="var(--surface)" stroke="var(--brand)" stroke-width="2.4"/>'; });
  s+='<text x="'+L+'" y="'+(H-6)+'">'+fmtDateShort(Math.min.apply(null,xs))+'</text><text x="'+(W-Rr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDateShort(Math.max.apply(null,xs))+'</text></svg>';
  return s;
}


/* ---------- profile, body, recovery, weekly summary ---------- */
function normCfg(){ const c=ST.config; if(!c.profile) c.profile={}; if(!c.measures) c.measures=[]; if(!c.milestones) c.milestones={}; if(!c.restSec) c.restSec=90; if(!c.saved) c.saved=[]; if(!c.coach) c.coach={auto:true,last:0,msgs:[],changes:{},done:{},asked:{}}; }
const prof = ()=> ST.config.profile||{};
function bwSeries(){
  const a=[]; ST.logs.forEach(l=>{ if(l.bodyweight>0) a.push({t:parseDT(l.date,l.time).getTime(),kg:l.bodyweight}); });
  (ST.config.measures||[]).forEach(m=>{ if(m.weight>0) a.push({t:parseDT(m.date,'08:00').getTime(),kg:m.weight}); });
  return a.sort((x,y)=>x.t-y.t);
}
const logMin = l=> l.durationMin>0 ? l.durationMin : Math.round(setCount(l)*2.5);
function weightAt(ms){ const s=bwSeries(); let w=null; s.forEach(x=>{ if(x.t<=ms) w=x.kg; }); if(w==null&&s.length) w=s[0].kg; return w||prof().weightKg||80; }
function estCal(l){ return 4.5*weightAt(parseDT(l.date,l.time).getTime())*logMin(l)/60; }
function periodStats(from,to){
  const ls=sortedLogs().filter(l=>{ const t=parseDT(l.date,l.time).getTime(); return t>=from&&t<to; });
  return {n:ls.length,min:ls.reduce((t,l)=>t+logMin(l),0),vol:ls.reduce((t,l)=>t+volOf(l),0),kcal:ls.reduce((t,l)=>t+estCal(l),0)};
}
function dTxt(diff,str,neutral,tail){
  if(diff==null) return '<span class="d">&nbsp;</span>';
  if(!diff) return '<span class="d">No change'+(tail||'')+'</span>';
  const up=diff>0; return '<span class="d '+(neutral?'':(up?'up':'dn'))+'">'+(up?'▲ ':'▼ ')+str+(tail||'')+'</span>';
}
function weekSummaryHtml(){
  const now=Date.now(), D=864e5; const c=periodStats(now-7*D,now+1), p=periodStats(now-14*D,now-7*D);
  const dur=m=> m>=60? Math.floor(m/60)+'h '+pad(m%60)+'m' : m+' min';
  const hasP=p.n>0;
  const target=Math.max(1,+prof().daysPerWeek||Math.min(ST.config.routine.days.length,5)||4), frac=Math.min(1,c.n/target), CIR=2*Math.PI*40;
  let h='<section><div class="hero"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A5C"/><stop offset="1" stop-color="#F0386B"/></linearGradient></defs><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="9"/><circle cx="50" cy="50" r="40" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(CIR*frac).toFixed(1)+' '+CIR.toFixed(1)+'"/></svg><div class="rt">'+c.n+'</div></div><div><div class="hs">Last 7 days</div><div class="hl">'+c.n+' of '+target+' workouts</div><div class="hs">'+(c.n?dur(c.min)+' · about '+fmtInt(c.kcal)+' kcal':'Your week fills in once you log a workout')+'</div></div></div><p class="sub" style="margin:10px 4px 0">Compared with the 7 days before. Calories are estimates.</p><div class="tiles" style="margin-top:10px">';
  h+='<div class="tile"><span class="num">'+c.n+'</span><span class="s">workout'+(c.n===1?'':'s')+'</span>'+(hasP||c.n?dTxt(c.n-p.n,Math.abs(c.n-p.n)+' vs before'):'<span class="d">&nbsp;</span>')+'</div>';
  h+='<div class="tile"><span class="num">'+dur(c.min)+'</span><span class="s">training time</span>'+(hasP?dTxt(c.min-p.min,Math.abs(c.min-p.min)+' min vs before'):'<span class="d">&nbsp;</span>')+'</div>';
  h+='<div class="tile"><span class="num">'+fmtInt(c.kcal)+'</span><span class="s">est. kcal burnt</span>'+(hasP?dTxt(Math.round(c.kcal-p.kcal),fmtInt(Math.abs(c.kcal-p.kcal))+' kcal vs before'):'<span class="d">&nbsp;</span>')+'</div>';
  const vd=c.vol-p.vol, vpc=p.vol>0?vd/p.vol*100:null;
  h+='<div class="tile"><span class="num">'+fmtInt(c.vol)+'</span><span class="s">kg lifted</span>'+(p.vol>0?dTxt(Math.round(vd),fmtInt(Math.abs(vd))+' kg ('+(vpc>=0?'+':'−')+fmt1(Math.abs(vpc))+'%)'):'<span class="d">'+(c.vol?'First week of data':'&nbsp;')+'</span>')+'</div>';
  const bs=bwSeries();
  if(!bs.length) h+='<div class="tile wide"><div class="row"><div class="sp"><span class="num">–</span><span class="s">body weight</span></div><button class="btn small ghost" data-act="updWeight">Add</button></div></div>';
  else {
    const cur=bs[bs.length-1]; let base=null; for(let i=bs.length-1;i>=0;i--){ if(bs[i].t<now-7*D){ base=bs[i]; break; } }
    if(!base){ const w=bs.filter(x=>x.t>=now-7*D); if(w.length>1) base=w[0]; }
    const df=base?Math.round((cur.kg-base.kg)*10)/10:null;
    h+='<div class="tile wide"><div class="row"><div class="sp"><span class="num">'+fmt1(cur.kg)+' kg</span><span class="s">body weight</span>'+(base?dTxt(df,fmt1(Math.abs(df))+' kg',true,' this week'):'<span class="d">One reading so far. Log again to see the change.</span>')+'</div><button class="btn small ghost" data-act="updWeight">Update</button></div></div>';
  }
  return h+'</div></section>';
}

const MUSCLES=['Chest','Shoulders','Biceps','Triceps','Back','Core','Quads','Hamstrings','Glutes','Calves'];
const STAT={fat:'Needs rest',rec:'Recovering',near:'Almost ready',ready:'Ready',none:'Not trained yet'};
function recoveryMap(){
  const now=Date.now(), m={};
  sortedLogs().forEach(l=>{
    const t=parseDT(l.date,l.time).getTime(); if(t>now) return; const cnt={};
    l.exercises.forEach(e=>{ const g=e.muscle||MUSCLE[e.name]; if(g) cnt[g]=(cnt[g]||0)+e.sets.length; });
    Object.keys(cnt).forEach(g=>{ if(!m[g]||t>=m[g].t) m[g]={t:t,sets:cnt[g],day:l.dayName}; });
  });
  MUSCLES.forEach(g=>{
    const r=m[g]; if(!r){ m[g]={status:'none',f:null}; return; }
    r.hrs=(now-r.t)/36e5; r.win=r.sets>=6?72:48; r.f=r.hrs/r.win; r.status=r.f<.5?'fat':r.f<.8?'rec':r.f<1?'near':'ready';
  });
  return m;
}
const readiness=(map,g)=> map[g].status==='none'?1:Math.min(1,map[g].f);
function dayMuscles(d){ const s=new Set(); d.exercises.forEach(e=>{ const g=MUSCLE[e.name]; if(g) s.add(g); }); return Array.from(s); }

function ago(hrs){ return hrs<48?Math.max(1,Math.round(hrs))+' h ago':Math.round(hrs/24)+' days ago'; }
function recoveryHtml(){
  const map=recoveryMap(); const days=ST.config.routine.days; const sl=sortedLogs(); const last=sl[sl.length-1];

  h+='<div class="card"><b>Readiness by workout</b>'+sc.map(x=>'<div style="margin-top:12px"><div class="row"><span class="sp"><b>'+esc(x.d.name)+'</b> <span class="sub">'+esc(x.ms.join(', '))+'</span></span><b class="num" style="font-size:22px">'+Math.round(x.avg*100)+'%</b></div><div class="rbar"><i style="width:'+Math.round(x.avg*100)+'%"></i></div></div>').join('')+'</div>';

function usuallyDays(dayId){

  return Object.keys(c).filter(w=>c[w]>=2).sort((a,b)=>c[b]-c[a]).slice(0,3).map(w=>WDN[w].slice(0,3));

function predictDay(ds){
  const days=ST.config.routine.days; if(!days.length) return null;
  const sl=sortedLogs(), wd=parseDT(ds).getDay(), last=sl[sl.length-1];
  const li=last?days.findIndex(d=>d.id===last.dayId):-1, map=recoveryMap();

  const rows=days.map((d,i)=>{
    const ms=dayMuscles(d), ready=ms.length?ms.reduce((t,g)=>t+readiness(map,g),0)/ms.length:1;
    const rot=li<0?i:(i-li-1+days.length)%days.length, cnt=onWd.filter(l=>l.dayId===d.id).length;
    const assoc=onWd.length>=2?cnt/onWd.length:0;
    return {d:d,i:i,ready:ready,rot:rot,cnt:cnt,assoc:assoc,score:.4*(1-rot/days.length)+.35*assoc+.25*ready};
  });

  if(!last) why.push('Start of your routine');

  if(best.cnt>=2&&best.assoc>=.5) why.push('You usually train '+best.d.name+' on '+WDN[wd]+'s');

/* ---------- progressive overload ---------- */
const e1rm=(kg,reps)=> kg>0&&reps>0?(reps<=1?kg:kg*(1+Math.min(reps,12)/30)):0;
const bestE1=sets=> sets.reduce((m,x)=>Math.max(m,e1rm(x.kg,x.reps)),0);
function prFlags(name,kg,reps,key){
  if(!(kg>0)||!(reps>0)) return {};
  const h=liftHistory(name,key); if(!h.length) return {};
  let mk=0,me=0; const all=[]; h.forEach(x=>x.ex.sets.forEach(st=>{ mk=Math.max(mk,st.kg); me=Math.max(me,e1rm(st.kg,st.reps)); all.push(st); }));
  const kgPR=kg>mk, e1PR=e1rm(kg,reps)>me+0.05; const same=all.filter(st=>st.kg>=kg);
  return {kg:kgPR,e1:e1PR,rep:!kgPR&&!e1PR&&same.length>0&&reps>Math.max.apply(null,same.map(st=>st.reps))};
}
function overloadTarget(name,lo,hi,key,phase){
  const prev=lastOf(name,key); if(!prev) return null;
  const sets=prev.ex.sets, kg=prev.top.kg, minR=Math.min.apply(null,sets.map(st=>st.reps)), inc=kg>=20?2.5:1;
  if(phase==='deload') return {kg:kg,reps:Math.max(lo,minR),trim:'half',txt:'Deload week: do about half your usual sets at '+fmt(kg)+' kg and stop well short of failure.'};
  if(phase==='int'){
    if(kg>0) return {kg:kg+inc,reps:lo,trim:'one',txt:'Intensification: go heavier. Try '+fmt(kg+inc)+' kg for '+lo+'–'+(lo+2)+' reps, close to failure, with one fewer set.'};
    return {kg:0,reps:hi,trim:'one',txt:'Intensification: push every set close to failure, add load if you can.'};
  }
  if(sets.every(st=>st.reps>=hi)){
    if(kg>0) return {kg:kg+inc,reps:lo,txt:'You hit '+hi+' reps on every set last time. Try '+fmt(kg+inc)+' kg for '+lo+'+ reps.'};
    return {kg:0,reps:hi+1,txt:'You hit '+hi+' reps on every set. Add a rep or a slower tempo, or add weight.'};
  }
  if(minR<lo) return {kg:kg,reps:lo,txt:'Hold '+fmt(kg)+' kg and aim for '+lo+' reps on every set.'};
  const t=Math.min(hi,minR+1); return {kg:kg,reps:t,txt:'Stay at '+fmt(kg)+' kg and add a rep: aim for '+t+' on each set.'};
}
function exStatHtml(e,i,key){
  const hist=liftHistory(e.name,key);

  const bestPrev=hist.reduce((m,x)=>Math.max(m,bestE1(x.ex.sets)),0), cur=done.length?bestE1(done):0;
  const fl={}; done.forEach(st=>{ const f=prFlags(e.name,st.kg,st.reps,key); if(f.kg) fl.kg=1; if(f.e1) fl.e1=1; if(f.rep) fl.rep=1; });
  const chips=(fl.kg?'<span class="chip good">Weight PR</span>':'')+(fl.e1?'<span class="chip good">1RM PR</span>':'')+(fl.rep?'<span class="chip good">Rep PR</span>':'');

  if(ov&&!e.sets.every(st=>st.done)) h+='<div class="tgt"><span>'+esc(ov.txt)+'</span><button class="btn small ghost" data-act="ovl" data-i="'+i+'">Apply</button></div>';
  if(ov&&ov.kg>=30&&compNames().has(e.name)&&!e.sets.some(st=>st.done)){ const r5=x=>Math.max(20,Math.round(x/2.5)*2.5); h+='<p class="sub" style="margin-top:6px;font-size:12px">Ramp-up: '+r5(ov.kg*.4)+' × 8, '+r5(ov.kg*.6)+' × 5, '+r5(ov.kg*.8)+' × 3 (kg × reps)</p>'; }
  return h+'</div>';
}
function prEvents(){
  const ev=[], base={};
  sortedLogs().forEach(l=>l.exercises.forEach(e=>{
    if(!e.sets.length) return; const b=base[e.name], ts=topSet(e.sets), te=bestE1(e.sets);
    if(b){ const kw=ts.kg>b.kg, ke=te>b.e1+0.05; if(kw||ke) ev.push({date:l.date,time:l.time,name:e.name,kg:ts.kg,reps:ts.reps,e1:te,kw:kw,ke:ke}); }
    base[e.name]={kg:Math.max(b?b.kg:0,ts.kg),e1:Math.max(b?b.e1:0,te)};
  }));
  return ev;
}
function recordsHtml(){
  const names=allLiftNames(); if(!names.length) return '<div class="empty">Log a workout and your records appear here automatically.</div>';
  const ev=prEvents().filter(x=>dayDiff(x.date,today())<=30).reverse();
  let h='<div class="tiles"><div class="tile"><span class="num">'+ev.length+'</span><span class="s">new PR'+(ev.length===1?'':'s')+' in 30 days</span></div><div class="tile"><span class="num">'+names.length+'</span><span class="s">lifts tracked</span></div></div>';
  h+='<div class="card"><b>Recent PRs</b>'+(ev.length?ev.slice(0,10).map(x=>'<div class="mrow"><div class="sp"><b>'+esc(x.name)+'</b><div class="sub" style="font-size:13px">'+esc(fmtDate(x.date))+' · '+fmt(x.kg)+' kg × '+x.reps+' · est. 1RM '+fmt1(x.e1)+' kg</div></div>'+(x.kw?'<span class="chip good">Weight</span>':'')+(x.ke&&!x.kw?'<span class="chip good">1RM</span>':'')+'</div>').join(''):'<p class="sub" style="margin-top:6px">No new records in the last 30 days. Keep pushing, they come in waves.</p>')+'</div>';
  const rows=names.map(n=>{
    const hist=liftHistory(n); let bk=null,be=null;
    hist.forEach(x=>x.ex.sets.forEach(st=>{ if(!bk||st.kg>bk.kg||(st.kg===bk.kg&&st.reps>bk.reps)) bk={kg:st.kg,reps:st.reps,date:x.log.date}; const e1=e1rm(st.kg,st.reps); if(!be||e1>be.v) be={v:e1,date:x.log.date}; }));
    return {n:n,bk:bk,be:be};
  }).sort((a,b)=>(b.be?b.be.v:0)-(a.be?a.be.v:0));
  h+='<div class="card"><b>All-time bests</b>'+rows.map(r=>'<div class="mrow"><div class="sp"><b>'+esc(r.n)+'</b><div class="sub" style="font-size:13px">Heaviest '+fmt(r.bk.kg)+' kg × '+r.bk.reps+' · '+esc(fmtDate(r.bk.date))+'</div></div><div style="text-align:right"><b class="num" style="font-size:20px">'+(r.be&&r.be.v?fmt1(r.be.v):'–')+'</b><div class="sub" style="font-size:12px">est. 1RM kg</div></div></div>').join('')+'<p class="sub" style="margin-top:8px">Estimated 1RM uses the Epley formula, capped at 12 reps. It is a guide, not a max attempt.</p></div>';
  return h;
}

function coachFocus(){

  if(goal==='both') return newish
    ? {title:'Building muscle and losing fat together',body:'Recomposition is realistic for beginners and people returning after a layoff. Keep protein high, eat around maintenance or a small deficit, and push progressive overload every week.'}
    : {title:'Pick one goal at a time',body:'Lean, experienced lifters generally cannot build muscle and lose fat at the same time. Run a short cut or a lean bulk (about 250–500 kcal above maintenance), then switch.'};
  if(goal==='fat') return {title:'Losing fat while keeping muscle',body:'Use a deficit of roughly 300–500 kcal a day, keep protein at 1.6–2.2 g per kg, and keep training volume and intensity largely intact so your body holds on to muscle.'};

}

const PHASE={acc:['Accumulation','Moderate-to-high volume at moderate intensity. Build work capacity and add reps or weight steadily.'],int:['Intensification','Lower volume and higher intensity. Go heavier and push closer to your limits.'],deload:['Deload','Cut volume and/or intensity to roughly 40–60%. Let joints, connective tissue and your nervous system recover.']};
function blockInfo(ds){
  const b=ST.config.block; if(!b||!b.start) return null; const acc=b.acc||4, itn=b.int||2, len=acc+itn+1;
  const w=Math.floor(dayDiff(b.start,ds)/7); if(w<0) return null; const k=w%len;
  if(k<acc) return {phase:'acc',week:k+1,total:acc,cycle:Math.floor(w/len)+1};

}

function liftCard(log,e,idx){
  const key=keyOf(log); const hist=liftHistory(e.name,key); const prev=hist.length?hist[hist.length-1]:null; const top=topSet(e.sets);
  const bestBefore=hist.reduce((m,x)=>Math.max(m,x.top.kg),0); const isPR=hist.length>0&&top.kg>bestBefore; const e1=bestE1(e.sets), pe1=hist.reduce((m,x)=>Math.max(m,bestE1(x.ex.sets)),0), isE1=hist.length>0&&e1>pe1+0.05;
  const best=Math.max(bestBefore,top.kg);
  const tags=(log.tags||[]).filter(t=>LOWTAGS.indexOf(t)>=0);
  let type,title,body,big='',showProj=false;
  if(!prev){ type='first'; title='First log of '+e.name; big='<span class="num">'+fmt(top.kg)+'</span> kg × '+top.reps; body='This is your starting line. Every future session gets compared to it.'; }
  else {
    const dk=top.kg-prev.top.kg, dr=top.reps-prev.top.reps;
    if(dk>0){ type='up'; const pc=prev.top.kg>0?dk/prev.top.kg*100:0; title='You lifted '+fmt(dk)+' kg more on '+e.name; big='<span class="num">'+fmt(prev.top.kg)+'</span> → <span class="num">'+fmt(top.kg)+'</span> kg'+(pc>0?' · <b class="up">+'+fmt1(pc)+'%</b>':''); body=(pc>0?'That is a '+fmt1(pc)+'% improvement on your last session. ':'')+'Strength comes from small jumps like this stacking up.'; showProj=true; }
    else if(dk<0){ type='down'; title=e.name+' was '+fmt(-dk)+' kg lighter today'; big='<span class="num">'+fmt(prev.top.kg)+'</span> → <span class="num">'+fmt(top.kg)+'</span> kg'; body='Off days happen and one session is a single data point. You still showed up and logged it.'+(tags.length?' You noted "'+esc(tags[0].toLowerCase())+'", so training at all counts.':''); }
    else if(dr>0){ type='reps'; title=dr+' more rep'+(dr>1?'s':'')+' on '+e.name; big='<span class="num">'+fmt(top.kg)+'</span> kg × '+prev.top.reps+' → <b class="up">'+top.reps+'</b>'; body='Same weight, more reps. That is real progress, and it sets up the next weight increase.'; showProj=true; }
    else if(dr<0){ type='down'; title=e.name+' held at '+fmt(top.kg)+' kg'; big='<span class="num">'+fmt(top.kg)+'</span> kg × '+prev.top.reps+' → '+top.reps; body='A rep or two down is normal. Hold this weight again and build back up.'+(tags.length?' You noted "'+esc(tags[0].toLowerCase())+'", which fits.':''); }
    else { type='reps'; title='Steady on '+e.name; big='<span class="num">'+fmt(top.kg)+'</span> kg × '+top.reps; body='Matched last time exactly. Consistency is how the next jump gets earned.'; showProj=true; }

  let proj=''; if(showProj) proj='<div class="proj">'+esc(projText(e.name,key,best))+'</div>';
  return '<article class="rc '+type+'" style="--i:'+idx+'"><h3>'+esc(title)+'</h3>'+((isPR||isE1)?'<div class="row" style="margin-top:6px;gap:6px">'+(isPR?'<span class="chip good">New weight PR</span>':'')+(isE1?'<span class="chip good">New 1RM PR</span>':'')+'</div>':'')+'<p class="big">'+big+'</p><p>'+body+'</p>'+(e1>0?'<p class="sub" style="margin-top:6px">Est. 1RM '+fmt1(e1)+' kg'+(pe1>0?' ('+(e1>=pe1?'+':'−')+fmt1(Math.abs(e1-pe1))+' vs your best)':'')+'</p>':'')+proj+'</article>';

function reportView(){

function makeSample(){
  const startKg={'Barbell Bench Press':40,'Seated Cable Row':40,'Machine Shoulder Press':25,'Lat Pulldown':45,'Triceps Pushdown':20,'Dumbbell Curl':10,'Leg Press':100,'Romanian Deadlift':50,'Leg Extension':35,'Seated Leg Curl':30,'Standing Calf Raise':40,'Cable Crunch':25,'Incline Dumbbell Press':14,'Chest-Supported Row':30,'Lateral Raise':6,'Assisted Pull-up':40,'Overhead Cable Triceps Extension':15,'Hammer Curl':10,'Hack Squat':50,'Hip Thrust':60,'Lying Leg Curl':30,'Walking Lunge':10,'Seated Calf Raise':30,'Hanging Knee Raise':0};
  const times=['06:45','12:30','17:45','06:30','19:15','12:10','07:00','18:30','06:50','13:00','17:30','07:10'];
  const tagPick=[[],['Felt strong'],['No motivation'],[],['Tired – poor sleep'],[],['Felt strong','Great mood'],['No motivation'],[],['Stressed'],['No motivation'],['Great mood']];
  const count={}; const out=[]; const now=new Date(); const days=ST.config.routine.days;
  for(let i=0;i<12;i++){
    const dt=new Date(now.getTime()-(33-Math.round(i*2.8))*864e5); const day=days[i%days.length]; const time=times[i];
    const morning=parseInt(time.slice(0,2),10)<9;
    const exs=day.exercises.map(e=>{
      const c=count[e.name]=(count[e.name]||0)+1; const base=startKg[e.name]!=null?startKg[e.name]:20;
      let kg=base*(1+0.022*(c-1))+(morning?base*0.02:0)-(bucketOf(time)==='Evening'?base*0.015:0);
      kg=Math.round(kg/2.5)*2.5; const sets=[]; for(let j=0;j<e.sets;j++) sets.push({kg:kg,reps:Math.max(e.lo,e.hi-j-(c%2))});
      return {name:e.name,orig:null,muscle:MUSCLE[e.name]||'',sets:sets};
    });
    out.push({id:'l'+uid(),sample:true,dayId:day.id,dayName:day.name,date:dstr(dt),time:time,startedAt:dt.getTime(),durationMin:50+(i%4)*4,exercises:exs,tags:tagPick[i],note:'',energy:[3,4,2,4,2,3,5,2,3,3,2,5][i],bodyweight:i%3===0?Math.round((92-i*0.2)*10)/10:null});
  }
  return out;
}

  blockExplain(){
    const ph=(c,t,w,d)=>'<div class="card" style="box-shadow:none;border-left:6px solid '+c+'"><div class="row"><b class="sp">'+t+'</b><span class="chip">'+w+'</span></div><p style="margin-top:4px;font-size:15px">'+d+'</p></div>';
    openSheet('<h2>What is a training block?</h2>'
      +'<p>You do not get stronger <b>during</b> a workout. You get stronger when your body <b>recovers</b> from it. A training block is a simple plan that mixes harder weeks with easier ones, so you keep improving instead of getting stuck or worn out.</p>'
      +'<h2 style="font-size:20px;margin:16px 0 8px">The three stages</h2><div class="stack">'
      +ph('var(--brand)','1. Build (Accumulation)','3–6 weeks','Do a good amount of work at a steady, challenging effort. Add a rep or a little weight when you can. Think of it as laying bricks.')
      +ph('var(--d3)','2. Push (Intensification)','2–4 weeks','Fewer sets, but heavier weights and closer to your limit. Think of it as the final sprint.')
      +ph('var(--good)','3. Rest (Deload)','1 week','About half the usual work. It should feel easy on purpose. Your joints, tendons and energy catch up, and you come back stronger.')
      +'</div>'
      +'<h2 style="font-size:20px;margin:16px 0 8px">Why it is in this app</h2>'
      +'<p>Most people either repeat the same workout until progress stops, or train hard every week until they are tired, sore or injured. A block avoids both. The app keeps count of the weeks for you, shows which stage you are in on the home page, and adjusts the target on each exercise to match: heavier with one less set in the Push weeks, and half the sets in the Rest week.</p>'
      +'<h2 style="font-size:20px;margin:16px 0 8px">An example</h2>'
      +'<p>4 weeks Build, 2 weeks Push, 1 week Rest. That is a 7-week cycle, then you start again. Over time each cycle starts from a higher level than the last.</p>'
      +'<h2 style="font-size:20px;margin:16px 0 8px">Good to know</h2>'
      +'<p class="sub">It is optional. The weeks are counted by the calendar from the day you start, so if you take time off, restart the block with Change block. If you feel run down before a Rest week is due, it is fine to take one early.</p>'
      +'<div class="stack" style="margin-top:14px">'+(ST.config.block&&ST.config.block.start?'':'<button class="btn block" data-act="blockOpen">Set up my block</button>')+'<button class="btn ghost block" data-act="closeSheet">Got it</button></div>'); },
  blockOpen(){ const b=ST.config.block||{}; UI.blk={acc:b.acc||4,int:b.int||2}; blockSheet(); },

    showTailorPreview(plan,'request');
  },

  saveConfirm(){ const v=(($('#sname')||{}).value||'').trim()||'My routine'; snapshot(v); closeSheet(); render(true); toast('Routine saved'); },

  capply(el){ coachAct('apply:'+el.dataset.id,'Apply: '+(ST.config.coach.changes[el.dataset.id]||{}).title); render(true); },
  cskip(el){ const ch=ST.config.coach.changes[el.dataset.id]; if(ch){ ch.st='skipped'; ST.config.coach.done[ch.key]=true; persistConfig(); } render(true); },
  cdont(el){ cu('I don\'t get it'); UI.csimple=(UI.csimple||0)+1; const ch=ST.config.coach.changes[el.dataset.id]; if(ch&&!ch.src) coachExplain(el.dataset.id,'next'); else coachFree('I do not understand: '+(ch?ch.title+'. '+ch.why:'')); render(true); },
  ptab(el){ UI.pTab=el.dataset.t; render(true); },
  pmetric(el){ UI.pMetric=el.dataset.m; render(true); },
  ccat(el){ UI.coachCat=el.dataset.c; render(true); },
  guideRefresh(){ render(true); toast('Suggestions updated'); },
  ovl(el){ const d=ST.draft, e=d.exercises[+el.dataset.i], bi=blockInfo(d.date), o=overloadTarget(e.name,e.lo,e.hi,d.date+' '+d.time,bi?bi.phase:'acc'); if(!o) return; e.sets.forEach(st=>{ if(st.done) return; if(o.kg>0||st.kg==='') st.kg=o.kg>0?o.kg:st.kg; st.reps=o.reps; }); if(o.trim==='half'){ const t=Math.max(1,Math.ceil(e.sets.length/2)); while(e.sets.length>t&&e.sets.some(x=>!x.done)){ e.sets.splice(e.sets.map(x=>x.done).lastIndexOf(false),1); } } else if(o.trim==='one'&&e.sets.length>2){ const j=e.sets.map(x=>x.done).lastIndexOf(false); if(j>=0) e.sets.splice(j,1); } persistDraft(); render(true); toast('Target applied'); },
  recDay(el){ UI.recDay=el.dataset.id==='none'?null:el.dataset.id; render(true); },
  mkey(el){ UI.mKey=el.dataset.k; render(true); },
  saveMeasure(){
    const f=UI.mf, e={id:uid(),date:f.date||today()}; let any=false;
    MEAS.forEach(m=>{ const v=parseFloat(f[m[0]]); if(v>0){ e[m[0]]=v; any=true; } });
    if(!any){ toast('Enter at least one measurement'); return; }
    ST.config.measures.push(e); persistConfig(); UI.mf={date:e.date}; toast('Measurements saved'); render(true);
  },
  delMeasureAsk(el){ const id=el.dataset.id; askConfirm('Delete this entry?','Delete entry',()=>{ ST.config.measures=ST.config.measures.filter(m=>m.id!==id); persistConfig(); closeSheet(); render(true); }); },

  async tailor(){
    const p=prof(); if(!p.goal){ toast('Choose a main goal first'); return; }
    const ctl=new AbortController(); TCTL=ctl;
    openSheet('<h2>Building your routine…</h2><p class="sub">Using your goal, experience, schedule and limits.</p><button class="btn ghost block" style="margin-top:14px" data-act="tailorCancel">Cancel</button>');
    let plan=null, src='rules';
    try{ plan=await tailorWithClaude(p,ctl); src='claude'; }catch(e){ if(e&&e.code==='cancelled') return; plan=null; }
    if(ctl.signal.aborted) return;

    ST.config.routine.days=TP.days.map(d=>({id:'d'+uid(),name:d.name,focus:d.focus,exercises:d.exercises.map(e=>mkEx(e.name,e.sets,e.lo,e.hi))}));

    persistConfig(); UI.sel.dayId=null; UI.recDay=undefined; TP=null; closeSheet(); UI.about=false; render(); toast('Routine updated');

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return; const f=A[el.dataset.act]; if(f){ ev.preventDefault(); f(el,ev); }
});
function onInput(ev){
  const el=ev.target; const k=el.dataset&&el.dataset.in; if(!k) return;
  const d=ST.draft;
  if(k==='kg'||k==='reps'){ if(ev.type==='input') setVal(el); return; }
  if(k==='search'){ const q=el.value.toLowerCase().trim(); $$('#sheetBody .pk-item').forEach(b=>{ b.hidden=!(b.textContent.toLowerCase().indexOf(q)>=0); }); $$('#sheetBody .pk-group').forEach(g=>{ if(g.querySelector('.pk-item')) g.hidden=!$$('.pk-item',g).some(b=>!b.hidden); }); return; }
  if(k==='selDate'){ UI.sel.date=el.value||today(); if(ev.type==='change'){ if(!UI.sel.picked){ const pr=predictDay(UI.sel.date); if(pr) UI.sel.dayId=pr.day.id; } startSheet(true); } return; }
  if(k==='sdate'||k==='stime'){ if(!d) return; if(k==='sdate') d.date=el.value||d.date; else d.time=el.value||d.time; persistDraft(); if(ev.type==='change') render(true); return; }
  if(k==='hdate'||k==='htime'){ if(ev.type!=='change') return; const lg=ST.logs.find(x=>x.id===UI.histOpen); if(!lg||!el.value) return; if(k==='hdate') lg.date=el.value; else lg.time=el.value; persistLog(lg); render(true); toast('Date and time updated'); return; }
  if(k==='selTime'){ UI.sel.time=el.value||UI.sel.time; UI.sel.tEdited=true; return; }
  if(k==='updw') return;
  if(k==='guide'){ ST.config.guide=el.value; persistConfig(); return; }
  if(k==='req'){ UI.req=el.value; return; }
  if(k==='cdraft'){ UI.cdraft=el.value; return; }
  if(k==='sname') return;
  if(k==='vseek'){ if(VP){ VP.t=(+el.value)/1000*REPVID.total(); } return; }
  if(k==='fnote'){ FIN.note=el.value; return; } if(k==='fbw'){ FIN.bw=el.value; return; }
  if(k==='plift'){ UI.progressLift=el.value; render(); return; }
  if(k==='milestone'){ const v=parseFloat(el.value); if(v>0){ ST.config.milestones[UI.progressLift]=v; persistConfig(); } if(ev.type==='change') render(true); return; }
  if(k.indexOf('p_')===0){ const pp=prof(), f=k.slice(2); if(f==='name'||f==='limits') pp[f]=el.value; else { const v=parseFloat(el.value); pp[({age:'age',height:'heightCm',weight:'weightKg'})[f]]=v>0?v:''; } persistConfig(); return; }
  if(k.indexOf('m_')===0){ const f=k.slice(2); if(f==='date') UI.mf.date=el.value||today(); else { const v=parseFloat(el.value); UI.mf[f]=v>0?v:''; } return; }
  const rd=ST.config.routine.days.find(x=>x.id===UI.routineDay);
  if(rd){
    if(k==='rname'){ rd.name=el.value; persistConfig(); return; } if(k==='rfocus'){ rd.focus=el.value; persistConfig(); return; }
    const card=el.closest('[data-ri]'); if(card){ const e=rd.exercises[+card.dataset.ri]; const v=parseInt(el.value,10); if(v>0){ if(k==='rsets') e.sets=Math.min(10,v); if(k==='rlo') e.lo=v; if(k==='rhi') e.hi=v; persistConfig(); } }
  }
}
document.addEventListener('input',onInput); document.addEventListener('change',onInput);
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.shiftKey&&ev.target&&ev.target.id==='cin'){ ev.preventDefault(); A.csend(); } });

loadLocal(); normCfg(); dirtyLogs();
render();
initSync().then(maybeUpdatePrompt,maybeUpdatePrompt);
})();
